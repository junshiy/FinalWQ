[tool.black]
line-length = 100
target-version = ["py39"]
extend-exclude = '''
/(
    \.venv
  | migrations
)/
'''

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "FinalWQ.settings"
python_files = ["test_*.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --strict-markers"
testpaths = ["faultdiag"]
